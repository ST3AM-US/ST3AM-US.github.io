<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="6" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.4"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Stylized telematics device illustration -->
  <g filter="url(#shadow)" transform="translate(200,140)">
    <!-- main body -->
    <rect x="0" y="0" width="400" height="220" rx="22" fill="url(#device)" stroke="#0b1220" stroke-width="2"/>
    <!-- top accent strip -->
    <rect x="0" y="0" width="400" height="34" rx="22" fill="#0b1220"/>
    <rect x="0" y="22" width="400" height="14" fill="#0b1220"/>
    <!-- LED indicators -->
    <circle cx="40" cy="17" r="5" fill="#22c55e"/>
    <circle cx="60" cy="17" r="5" fill="#3b82f6"/>
    <circle cx="80" cy="17" r="5" fill="#f59e0b"/>
    <!-- ST3AM brand mark -->
    <text x="200" y="135" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="48" font-weight="700" fill="#f8fafc" letter-spacing="6">ST3AM</text>
    <text x="200" y="170" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" letter-spacing="3">FIELDBEACON · GPS TELEMATICS</text>
    <!-- ports row -->
    <rect x="40" y="195" width="40" height="16" rx="3" fill="#0b1220"/>
    <rect x="100" y="195" width="40" height="16" rx="3" fill="#0b1220"/>
    <rect x="160" y="195" width="40" height="16" rx="3" fill="#0b1220"/>
    <rect x="280" y="190" width="80" height="24" rx="4" fill="#0b1220"/>
  </g>

  <!-- Placeholder note overlay -->
  <g transform="translate(400,440)">
    <rect x="-260" y="-22" width="520" height="40" rx="6" fill="#fbbf24" opacity="0.95"/>
    <text x="0" y="4" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="14" font-weight="700" fill="#111827">PLACEHOLDER — replace with ST3AM-branded hardware photo</text>
  </g>

  <text x="400" y="60" text-anchor="middle" font-family="Lato, Arial, sans-serif" font-size="20" font-weight="300" fill="#94a3b8" letter-spacing="2">FieldBeacon in-vehicle device</text>
</svg>
